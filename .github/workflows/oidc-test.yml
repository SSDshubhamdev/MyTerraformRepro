
name: Azure VM Decommission

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure Subscription ID to validate"
        required: true
        type: string

      resource_group:
        description: "Azure Resource Group containing the VM"
        required: true
        type: string

      vm_name:
        description: "Exact Azure VM name to delete"
        required: true
        type: string

      confirm_delete:
        description: "Confirm VM and eligible NIC deletion"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  id-token: write

jobs:
  decommission:
    name: Decommission Azure VM and NIC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep the existing OIDC authentication configuration unchanged.
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Validate subscription, Resource Group and VM
        uses: azure/powershell@v2
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          CONFIRM_DELETION: ${{ inputs.confirm_delete }}
        with:
          azPSVersion: latest
          errorActionPreference: Stop
          inlineScript: |
            $ErrorActionPreference = "Stop"

            if ($env:CONFIRM_DELETION -ne "yes") {
              throw "Deletion cancelled. Set confirm_delete to yes."
            }

            # Validate subscription ID format.
            $parsedSubscriptionId = [guid]::Empty
            if (-not [guid]::TryParse(
              $env:SUBSCRIPTION_ID,
              [ref]$parsedSubscriptionId
            )) {
              throw "Invalid Azure Subscription ID format."
            }

            if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP)) {
              throw "Resource Group name cannot be empty."
            }

            if ([string]::IsNullOrWhiteSpace($env:VM_NAME)) {
              throw "VM name cannot be empty."
            }

            # Confirm OIDC authentication is available.
            $context = Get-AzContext
            if (-not $context -or -not $context.Account) {
              throw "Azure PowerShell is not authenticated."
            }

            # Select the subscription explicitly provided by the user.
            # The OIDC service principal must have access to this subscription.
            $subscription = Get-AzSubscription `
              -SubscriptionId $parsedSubscriptionId.ToString() `
              -ErrorAction Stop

            if (-not $subscription) {
              throw "The requested subscription is not accessible."
            }

            Set-AzContext `
              -SubscriptionId $subscription.Id `
              -ErrorAction Stop | Out-Null

            $context = Get-AzContext

            if ($context.Subscription.Id -ne $parsedSubscriptionId.ToString()) {
              throw "Active Azure subscription does not match the input."
            }

            Write-Host "Subscription validated: $($context.Subscription.Id)"

            # Validate Resource Group.
            $rg = Get-AzResourceGroup `
              -Name $env:RESOURCE_GROUP `
              -ErrorAction Stop

            Write-Host "Resource Group validated: $($rg.ResourceGroupName)"

            # Validate VM and its attached NICs before deletion.
            $vm = Get-AzVM `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -Name $env:VM_NAME `
              -ErrorAction Stop

            Write-Host "VM validated: $($vm.Name)"
            Write-Host "VM resource ID: $($vm.Id)"

            foreach ($nicRef in $vm.NetworkProfile.NetworkInterfaces) {
              $nicId = $nicRef.Id

              if ([string]::IsNullOrWhiteSpace($nicId)) {
                throw "VM contains an invalid NIC resource ID."
              }

              $nicParts = $nicId -split "/"
              if ($nicParts.Count -lt 9) {
                throw "Invalid NIC resource ID: $nicId"
              }

              $nic = Get-AzNetworkInterface `
                -ResourceId $nicId `
                -ErrorAction Stop

              Write-Host "Attached NIC validated: $($nic.Name)"
            }

            Write-Host "Pre-deletion validation completed successfully."

      - name: Delete Azure VM and eligible NICs
        uses: azure/powershell@v2
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          CONFIRM_DELETION: ${{ inputs.confirm_delete }}
        with:
          azPSVersion: latest
          errorActionPreference: Stop
          inlineScript: |
            $ErrorActionPreference = "Stop"

            $scriptPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "MyTerraformRepro/scripts/Delete-AzureVM.ps1"

            if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              throw "Deletion script not found: $scriptPath"
            }

            Write-Host "PowerShell script found: $scriptPath"

            & $scriptPath `
              -SubscriptionId $env:SUBSCRIPTION_ID `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -VMName $env:VM_NAME `
              -ConfirmDeletion $env:CONFIRM_DELETION

            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
              throw "Decommission script reported a non-zero exit code."
            }

      - name: Verify VM deletion
        uses: azure/powershell@v2
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          CONFIRM_DELETION: ${{ inputs.confirm_delete }}
        with:
          azPSVersion: latest
          errorActionPreference: Stop
          inlineScript: |
            $ErrorActionPreference = "Stop"

            if ($env:CONFIRM_DELETION -ne "yes") {
              throw "Deletion was not confirmed."
            }

            $subscriptionId = [guid]::Empty
            if (-not [guid]::TryParse(
              $env:SUBSCRIPTION_ID,
              [ref]$subscriptionId
            )) {
              throw "Invalid subscription ID during verification."
            }

            Set-AzContext `
              -SubscriptionId $subscriptionId.ToString() `
              -ErrorAction Stop | Out-Null

            # Verify that the Resource Group still exists.
            Get-AzResourceGroup `
              -Name $env:RESOURCE_GROUP `
              -ErrorAction Stop | Out-Null

            $remainingVM = Get-AzVM `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -Name $env:VM_NAME `
              -ErrorAction SilentlyContinue

            if ($null -ne $remainingVM) {
              throw "VM still exists. Investigate deletion status."
            }

            Write-Host "SUCCESS: VM resource deletion verified."

      - name: Azure logout
        if: always()
        shell: bash
        run: az logout
