```yaml 
name: Azure VM Decommission

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure Subscription ID"
        required: true
        type: string

      resource_group:
        description: "Azure Resource Group"
        required: true
        type: string

      vm_name:
        description: "Azure VM Name"
        required: true
        type: string

      confirm_delete:
        description: "Confirm VM deletion"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read
  id-token: write

jobs:
  decommission:
    name: Decommission Azure VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Subscription Allowlist
        shell: bash
        env:
          REQUESTED_SUBSCRIPTION: ${{ inputs.subscription_id }}
          ALLOWED_SUBSCRIPTIONS: ${{ secrets.AZURE_ALLOWED_SUBSCRIPTION_IDS }}
        run: |
          set -euo pipefail

          if [[ -z "$ALLOWED_SUBSCRIPTIONS" ]]; then
            echo "AZURE_ALLOWED_SUBSCRIPTION_IDS secret is missing."
            exit 1
          fi

          if [[ ! "$REQUESTED_SUBSCRIPTION" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid subscription ID format."
            exit 1
          fi

          ALLOWED=false
          IFS=',' read -ra SUBS <<< "$ALLOWED_SUBSCRIPTIONS"

          for SUB in "${SUBS[@]}"; do
            SUB="$(echo "$SUB" | xargs)"
            if [[ "${SUB,,}" == "${REQUESTED_SUBSCRIPTION,,}" ]]; then
              ALLOWED=true
              break
            fi
          done

          if [[ "$ALLOWED" != "true" ]]; then
            echo "Subscription is not in the approved allowlist."
            exit 1
          fi

          echo "Subscription allowlist validation passed."

      # Keep OIDC authentication
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}
          enable-AzPSSession: true

      - name: Validate and Delete Azure VM
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          errorActionPreference: Stop
          inlineScript: |
            $ErrorActionPreference = "Stop"

            $scriptPath = Join-Path $PWD "MyTerraformRepro/scripts/Delete-AzureVM.ps1"

            if (-not (Test-Path $scriptPath)) {
              throw "PowerShell script not found: $scriptPath"
            }

            & $scriptPath `
              -SubscriptionId "${{ inputs.subscription_id }}" `
              -ResourceGroupName "${{ inputs.resource_group }}" `
              -VMName "${{ inputs.vm_name }}" `
              -ConfirmDeletion "${{ inputs.confirm_delete }}"

      - name: Azure Logout
        if: always()
        shell: bash
        run: az logout
```
