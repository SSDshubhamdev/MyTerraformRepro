
name: Azure VM Decommission - Request

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure Subscription ID"
        required: true
        type: string

      resource_group:
        description: "Resource Group Name"
        required: true
        type: string

      vm_name:
        description: "Virtual Machine Name"
        required: true
        type: string

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - Dev
          - Prod

      requester:
        description: "Request Raised By"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  submit-decommission-request:
    name: Validate VM and Create Request
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Existing Azure OIDC login
      # ---------------------------------------------
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}
          enable-AzPSSession: true

      # ---------------------------------------------
      # 3. Verify Azure PowerShell context
      # ---------------------------------------------
      - name: Verify Azure Subscription
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            $ErrorActionPreference = "Stop"

            $subscriptionId = "${{ inputs.subscription_id }}"
            $tenantId = "${{ secrets.AZURE_TENANT_ID }}"

            $context = Get-AzContext

            if ($null -eq $context -or
                $null -eq $context.Account) {
              throw "Azure PowerShell authentication is missing. Check OIDC login."
            }

            $subscription = Get-AzSubscription `
              -SubscriptionId $subscriptionId `
              -TenantId $tenantId `
              -ErrorAction Stop

            if ($null -eq $subscription) {
              throw "Subscription is unavailable to the logged-in identity."
            }

            Set-AzContext `
              -SubscriptionObject $subscription `
              -ErrorAction Stop | Out-Null

            $verifiedContext = Get-AzContext

            if ($verifiedContext.Subscription.Id -ne $subscriptionId) {
              throw "Azure subscription context verification failed."
            }

            Write-Host "Azure subscription context verified."
            Write-Host "Subscription ID: $($verifiedContext.Subscription.Id)"

      # ---------------------------------------------
      # 4. Validate VM, inventory dependencies,
      #    and save the decommission request
      # ---------------------------------------------
      - name: Validate VM and Save Request
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            $ErrorActionPreference = "Stop"
            ./scripts/Submit-VMDecommissionRequest.ps1
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          VM_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTER: ${{ inputs.requester }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
          DECOMMISSION_NOTIFICATION_WEBHOOK: ${{ secrets.DECOMMISSION_NOTIFICATION_WEBHOOK }}

      # ---------------------------------------------
      # 5. Upload request summary for troubleshooting
      # ---------------------------------------------
      - name: Upload Request Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-decommission-request-summary
          path: decommission-request-summary.json
          if-no-files-found: ignore
          retention-days: 30
