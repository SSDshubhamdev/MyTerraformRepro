
name: Azure VM Decommission Request

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: Azure Subscription ID
        required: true
        type: string

      resource_group:
        description: Resource Group Name
        required: true
        type: string

      vm_name:
        description: Virtual Machine Name
        required: true
        type: string

      environment:
        description: Environment
        required: true
        type: choice
        options:
          - Dev
          - Prod

      requester:
        description: Request Raised By
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  submit-request:
    name: Validate VM and Save Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Keep existing OIDC authentication.
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Verify Azure and Storage Table
        shell: pwsh
        env:
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Azure authentication..."

          az account show --query "{subscription:id,tenant:tenantId}" --output json

          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI authentication check failed."
          }

          Write-Host "Checking Storage Table..."

          az storage table exists `
            --account-name $env:STORAGE_ACCOUNT `
            --name $env:TABLE_NAME `
            --auth-mode login `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "Storage Table existence check failed."
          }

          Write-Host "Creating table if it does not exist..."

          az storage table create `
            --account-name $env:STORAGE_ACCOUNT `
            --name $env:TABLE_NAME `
            --auth-mode login `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "Storage Table creation failed."
          }

      - name: Validate VM and Insert Request
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          VM_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTER: ${{ inputs.requester }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
        run: |
          ./scripts/Submit-VMDecommissionRequest.ps1

      - name: Upload Request Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-decommission-request-summary
          path: decommission-request-summary.json
          if-no-files-found: ignore
          retention-days: 30
