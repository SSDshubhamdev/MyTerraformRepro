
name: Azure VM Stop Request

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure Subscription ID"
        required: true
        type: string

      resource_group:
        description: "Azure Resource Group"
        required: true
        type: string

      vm_name:
        description: "Azure VM Name"
        required: true
        type: string

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - Dev
          - Prod

      requester:
        description: "Requester Name"
        required: true
        type: string

      requester_email:
        description: "Requester Email Address"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  stop-vm:
    name: Validate and Stop Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Verify Azure Login
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          az account show --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Azure login verification failed."
          }

      - name: Ensure Azure Storage Table Exists
        shell: pwsh
        env:
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
        run: |
          $ErrorActionPreference = "Stop"

          az storage table create `
            --account-name $env:STORAGE_ACCOUNT `
            --name $env:TABLE_NAME `
            --auth-mode login `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or access the Azure Storage Table."
          }

      - name: Submit Request and Stop VM
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          REQUESTER: ${{ inputs.requester }}
          REQUESTER_EMAIL: ${{ inputs.requester_email }}
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
        run: |
          $ErrorActionPreference = "Stop"

          ./scripts/Submit-VMDecommissionRequest.ps1

      - name: Send Email Notification
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REQUESTER: ${{ inputs.requester }}
          REQUESTER_EMAIL: ${{ inputs.requester_email }}
          VM_NAME: ${{ inputs.vm_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          ENVIRONMENT: ${{ inputs.environment }}
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "./scripts/Send-VMDecommissionEmail.ps1") {
            ./scripts/Send-VMDecommissionEmail.ps1
          }
          else {
            Write-Warning "Email script not found. Skipping email notification."
          }

      - name: Upload Request Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-stop-request-summary
          path: |
            vm-stop-request-summary.json
            vm-stop-request-summary.txt
          if-no-files-found: warn
