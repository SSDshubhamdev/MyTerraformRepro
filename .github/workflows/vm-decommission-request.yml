
name: Azure VM Decommission Request

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure Subscription ID"
        required: true
        type: string

      resource_group:
        description: "Azure Resource Group"
        required: true
        type: string

      vm_name:
        description: "Azure VM Name"
        required: true
        type: string

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - Dev
          - Test
          - UAT
          - Prod

      requester:
        description: "Requester's Name"
        required: true
        type: string

      requester_email:
        description: "Customer / Requester Email Address"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  submit-decommission-request:
    name: Deallocate VM and Notify Customer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required GitHub Secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "SMTP_USERNAME",
            "SMTP_APP_PASSWORD"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing GitHub secret: $name"
            }
          }

          Write-Host "Required secrets are configured."

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Verify Azure Login
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
        run: |
          $ErrorActionPreference = "Stop"

          $result = & az account show `
            --subscription $env:SUBSCRIPTION_ID `
            --output table 2>&1

          if ($LASTEXITCODE -ne 0) {
            throw "Azure login verification failed: $($result -join "`n")"
          }

          $result | Write-Host

      - name: Validate VM, Save Request, Deallocate and Wait
        id: submit
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          VM_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTER: ${{ inputs.requester }}
          REQUESTER_EMAIL: ${{ inputs.requester_email }}
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
        run: |
          ./scripts/Submit-VMDecommissionRequest.ps1

      - name: Send Customer Email After Confirmed Deallocation
        if: success() && steps.submit.outputs.vm_stopped == 'true'
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          VM_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTER: ${{ inputs.requester }}
          REQUESTER_EMAIL: ${{ inputs.requester_email }}
          REQUEST_ID: ${{ steps.submit.outputs.request_id }}
          VM_POWER_STATE: ${{ steps.submit.outputs.vm_power_state }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          ./scripts/Send-VMDecommissionEmail.ps1

      - name: Logout from Azure
        if: always()
        shell: pwsh
        run: |
          az logout 2>$null
          exit 0
