
name: Azure VM Decommission Request

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure Subscription ID"
        required: true
        type: string

      resource_group:
        description: "Azure Resource Group"
        required: true
        type: string

      vm_name:
        description: "Azure VM Name"
        required: true
        type: string

      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - Dev
          - Prod

      requester:
        description: "Requester Name"
        required: true
        type: string

      requester_email:
        description: "Requester Email Address"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  submit-and-stop:
    name: Submit Request and Deallocate VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Keep existing Azure OIDC authentication.
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Verify Azure Subscription
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
        run: |
          $ErrorActionPreference = "Stop"

          az account set --subscription "$env:SUBSCRIPTION_ID"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to select the requested Azure subscription."
          }

          $accountJson = az account show --output json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify Azure subscription."
          }

          $account = $accountJson | ConvertFrom-Json

          if ($account.id -ne $env:SUBSCRIPTION_ID) {
            throw "Active subscription does not match the requested subscription."
          }

          Write-Host "Azure OIDC login and subscription verification successful."

      - name: Ensure Storage Table Exists
        shell: pwsh
        env:
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
        run: |
          $ErrorActionPreference = "Stop"

          az storage table create `
            --account-name "$env:STORAGE_ACCOUNT" `
            --name "$env:TABLE_NAME" `
            --auth-mode login `
            --only-show-errors `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create or access the Azure Storage Table."
          }

          Write-Host "Azure Storage Table is ready."

      - name: Save Request and Deallocate VM
        id: submit_request
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          VM_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTER: ${{ inputs.requester }}
          REQUESTER_EMAIL: ${{ inputs.requester_email }}
          STORAGE_ACCOUNT: shubhamstorage11
          TABLE_NAME: VMDecommissionRequests
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/Submit-VMDecommissionRequest.ps1

      - name: Send Email Notification
        if: always() && steps.submit_request.outputs.request_id != ''
        continue-on-error: true
        shell: pwsh
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REQUESTER: ${{ inputs.requester }}
          REQUESTER_EMAIL: ${{ inputs.requester_email }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          VM_ENVIRONMENT: ${{ inputs.environment }}
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          REQUEST_ID: ${{ steps.submit_request.outputs.request_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Stop"

          ./scripts/Send-VMDecommissionEmail.ps1

      - name: Upload Request Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-decommission-request-summary
          path: decommission-request-summary.json
          if-no-files-found: warn
