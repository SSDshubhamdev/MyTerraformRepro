
name: Azure VM Decommission

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Azure Resource Group name"
        required: true
        type: string

      vm_name:
        description: "Exact Azure VM name"
        required: true
        type: string

      confirm_delete:
        description: "Confirm VM deletion"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  id-token: write

jobs:
  decommission:
    name: Decommission Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Validate and delete Azure VM
        uses: azure/powershell@v2
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          CONFIRM_DELETION: ${{ inputs.confirm_delete }}
        with:
          azPSVersion: latest
          errorActionPreference: Stop
          inlineScript: |
            if ($env:CONFIRM_DELETION -ne "yes") {
              throw "Deletion cancelled. Set confirm_delete to yes to proceed."
            }

            . ./scripts/Delete-AzureVM.ps1 `
              -ResourceGroupName $env:RESOURCE_GROUP `
              -VMName $env:VM_NAME `
              -ConfirmDeletion $env:CONFIRM_DELETION
